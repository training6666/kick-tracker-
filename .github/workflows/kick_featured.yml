name: Kick TR anasayfa

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kayit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Türkçe anasayfayı kaydet
        run: |
          set -euo pipefail
          mkdir -p snapshots
          STAMP="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          curl -fsSL -A "kick-tracker" -H "Accept: application/json" \
            -o "snapshots/${STAMP}.json" \
            "https://kick.com/stream/featured-livestreams/tr"
          python3 - "$STAMP" <<'PY'
          import json, sys
          stamp = sys.argv[1]
          raw = json.load(open(f"snapshots/{stamp}.json", encoding="utf-8"))
          rows = raw if isinstance(raw, list) else raw.get("data") or raw.get("livestreams") or []
          now, seen = [], set()
          for row in rows:
              if not isinstance(row, dict):
                  continue
              ch = row.get("channel") or row.get("user") or {}
              if not isinstance(ch, dict):
                  ch = {}
              name = ch.get("slug") or ch.get("username") or row.get("slug") or "?"
              key = str(name).lower()
              if key in seen:
                  continue
              seen.add(key)
              now.append(name)
          try:
              old = json.load(open("ozet.json", encoding="utf-8"))
              kanallar = old.get("kanallar") or {}
          except FileNotFoundError:
              kanallar = {}
          for name in now:
              key = name.lower()
              slot = kanallar.get(key) or {"kanal": name, "ilk": stamp, "saat": 0}
              slot["saat"] += 1
              slot["son"] = stamp
              slot["simdi"] = True
              kanallar[key] = slot
          for key, slot in kanallar.items():
              if key not in seen:
                  slot["simdi"] = False
          sira = sorted(kanallar.values(), key=lambda x: x["saat"], reverse=True)
          wasabi = next((v for k, v in kanallar.items() if "wasabi" in k), None)
          if not wasabi:
              wasabi = {"durum": "henuz gorulmedi", "konuldugu_an": None, "kaldigi_saat": 0}
          else:
              wasabi = {
                  "durum": "simdi anasayfada" if wasabi.get("simdi") else "inmis",
                  "konuldugu_an": wasabi.get("ilk"),
                  "son_gorulme": wasabi.get("son"),
                  "kaldigi_saat": wasabi.get("saat", 0),
              }
          json.dump({
              "son_cekme": stamp,
              "en_cok_kalanlar": [
                  {"sira": i + 1, "kanal": x["kanal"], "saat": x["saat"], "simdi_anasayfada": x["simdi"]}
                  for i, x in enumerate(sira)
              ],
              "wasabi": wasabi,
              "kanallar": kanallar,
          }, open("ozet.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print("kayit", len(now))
          PY

      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots ozet.json
          git diff --staged --quiet || git commit -m "anasayfa ${STAMP}"
          git push
